global_defs {
    router_id SRV_LB_01
    enable_script_security
}

vrrp_instance VI_HA {
    state MASTER
    interface ens18
    virtual_router_id 51
    priority 110
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 1234
    }

    virtual_ipaddress {
        172.30.12.163/16 dev ens18 label ens18:vip-wan
        192.168.20.1/24 dev ens20 label ens20:vip-gw-wa
        192.168.20.4/24 dev ens20 label ens20:vip-web
        192.168.30.1/24 dev ens21 label ens21:vip-gw-db
        192.168.30.4/24 dev ens21 label ens21:vip-db
    }
}
